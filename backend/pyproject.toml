[project]
name = "contract-ai-analyzer-backend"
version = "0.1.0"
description = "Contract AI Analyzer — API и worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140,<1",
    "uvicorn[standard]>=0.50,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.40,<2.2",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "structlog>=25.1",
    "cryptography>=45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "httpx>=0.28",
    "ruff>=0.12",
    "mypy>=1.17",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["db/migrations/script.py.mako", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: требует PostgreSQL (TEST_DATABASE_URL)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PL"]
ignore = ["PLR0911", "PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR0915", "PLC0415"]
"app/db/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
