[project]
name = "contract-ai-analyzer-backend"
version = "0.1.0"
description = "Contract AI Analyzer — API и worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140,<1",
    "uvicorn[standard]>=0.50,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.40,<2.2",
    "alembic>=1.16,<2",
    "psycopg[binary]>=3.2,<4",
    "structlog>=25.1",
    "cryptography>=45",
    "argon2-cffi>=25.1",
    "httpx>=0.28",
    # Набор корневых сертификатов для httpx: не ниже 2026.10.19 — PYSEC-2026-4320 (скомпрометированные
    # промежуточные сертификаты eMudhra под корнем emSign ECC Root CA - G3).
    "certifi>=2026.10.19",
    # Разбор PDF. Лицензия AGPL-3.0 (или коммерческая): только внутреннее использование — см. docs/LICENSES.md.
    "pymupdf>=1.26",
    "lxml>=5.3",
    "olefile>=0.47",
    # Экспорт отчётов: PDF (reportlab, без HTML-рендера), DOCX, XLSX.
    "reportlab>=4.2",
    "python-docx>=1.2",
    "openpyxl>=3.1",
    # Маскировка перед облачным анализом (этап 10, docs/LICENSES.md): NER — модели slovnet/navec из пакета
    # natasha (MIT; сам пакет не импортируется — его морфология pymorphy2 не работает на Python 3.13),
    # морфология — pymorphy3 (MIT), пользовательские шаблоны — RE2 (BSD-3, линейное время),
    # телефоны — phonenumberslite (Apache-2.0).
    "natasha>=1.6,<2",
    "slovnet>=0.6,<1",
    "navec>=0.10,<1",
    "razdel>=0.5,<1",
    "pymorphy3>=2.0,<3",
    "google-re2>=1.1,<2",
    "phonenumberslite>=9.0,<10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "ruff>=0.12",
    "lxml-stubs>=0.5",
    "types-openpyxl>=3.1",
    "mypy>=1.17",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["db/migrations/script.py.mako", "py.typed", "exports/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: требует PostgreSQL (TEST_DATABASE_URL)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PL"]
ignore = ["PLR0911", "PLR0913", "PLR2004", "RUF001", "RUF002", "RUF003", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR0915", "PLC0415", "PLR0917"]
"app/db/migrations/**" = ["E501"]
# Эндпоинты FastAPI получают зависимости параметрами — их естественно больше пяти.
"app/api/**" = ["PLR0917"]
# Разбор форматов документов естественно ветвится по типам элементов.
"app/ingestion/**" = ["PLR0912"]
# Детекторы маскировки: по ветке на шаблон и контекст.
"app/redaction/detectors/**" = ["PLR0912"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["olefile", "reportlab", "reportlab.*", "navec", "slovnet", "pymorphy3", "re2"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyMuPDF не размечен типами полностью.
module = ["app.ingestion.pdf"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
# Генерация фикстур через PyMuPDF (API не размечен типами).
disallow_untyped_calls = false
disallow_incomplete_defs = false
